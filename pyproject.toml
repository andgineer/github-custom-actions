[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project]
name = "github-custom-actions"
dynamic = [ "version",]
description = "Python package for creating custom GitHub Actions."
keywords = [ "github", "actions", "workflow",]
classifiers = [ "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent",]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [ "Jinja2",]
[[project.authors]]
name = "Andrey Sorokin"
email = "andrey@sorokin.engineer"

[project.license]
file = "LICENSE"

[project.urls]
Homepage = "https://andgineer.github.io/github-custom-actions/"
Documentation = "https://andgineer.github.io/github-custom-actions/"

[tool.setuptools]
packages = "find:"

[tool.ruff]
line-length = 99

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.manifest]
include = [ "README.md", "LICENSE",]

[tool.hatch.version]
path = "src/github_custom_actions/__about__.py"

[dependency-groups]
dev = [
    "hatchling>=1.27.0",
    "invoke>=2.2.1",
    "mkdocs-awesome-pages-plugin>=2.9.2",
    "mkdocstrings[python]>=0.26.1",
    "pre-commit>=3.5.0",
    "pymdown-extensions>=10.15",
    "pyrefly>=1.0.0",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
]

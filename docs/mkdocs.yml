# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: github_custom_actions
site_url: https://andgineer.github.io/github-custom-actions
site_author: Andrey Sorokin

# Repository
repo_name: github_custom_actions
repo_url: https://github.com/andgineer/github-custom-actions
edit_uri: edit/master/docs
docs_dir: 'src/LANGUAGE'
site_dir: 'SITE_DIR'

nav:
  - index.md
  - installation.md
  - base.md
  - inputs.md
  - outputs.md
  - github_env_vars.md
  - main.md
  - summary.md
  - render.md

plugins:
  - awesome-pages
  - search:
      lang: LANGUAGE
  - mkdocstrings:
        handlers:
          python:
            options:
              show_root_heading: true

markdown_extensions:
  - abbr
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: 'docs/includes'

theme:
  name: material
  features:
    - toc.integrate
    - navigation.tracking
    - content.code.copy

extra:
  alternate:
    - name: English
      link: /github-custom-actions/
      lang: en
    - name: Русский
      link: /github-custom-actions/ru/
      lang: ru
